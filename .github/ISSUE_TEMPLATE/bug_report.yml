name: Bug Report
description: Report a bug in MeshNet
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      description: e.g., v0.1.0-alpha
    validations:
      required: true
